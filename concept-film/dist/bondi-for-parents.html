:root{--bg:#F6ECE0;--ink:#3A2419}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1512;--ink:#F6ECE0}}
:root[data-theme="dark"]{--bg:#1E1512;--ink:#F6ECE0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw - 32px,(100vh - 32px)*16/9);aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(120,60,30,.25)}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(58,36,25,.08);transition:opacity .3s}
#ui.hide{opacity:0;pointer-events:none}
#ui button{all:unset;cursor:pointer;width:clamp(56px,9vw,110px);aspect-ratio:1;border-radius:50%;background:#F27A63;box-shadow:0 12px 40px rgba(242,122,99,.45);display:grid;place-items:center}
#ui button svg{width:38%;margin-left:8%}
#bar{position:absolute;left:0;bottom:0;height:4px;background:#F27A63;width:0}
body.render #stage{width:1920px;height:1080px;border-radius:0;box-shadow:none}
body.render #ui,body.render #bar{display:none}
</style>

<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui"><button aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></button></div>
  <div id="bar"></div>
</div>
<script>
(() => {
const W = 1920, H = 1080, DUR = 33;
const RENDER = location.search.includes('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c'), g = cv.getContext('2d');

/* ================= utils ================= */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const popIn = (lt, t0, d = .35) => E.outBack(seg(lt, t0, t0 + d));
function rr(x, y, w, h, r, ctx = g) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

const INK = '#3A2419', INK2 = '#8A6A58', CORAL = '#F27A63', SAGE = '#6FAE84', AMBER = '#FFB061';
const HEAD = '"Inter Tight", Inter, system-ui, sans-serif';

/* ================= sprites ================= */
function sdfBox(x, y, bx, by, r) { const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }
function sdfHeart(x, y, a) {
  y += a * .15;
  const u = (x + y) / Math.SQRT2, v = (y - x) / Math.SQRT2, k = a / Math.SQRT2;
  return Math.min(sdfBox(u, v, a, a, a * .22), Math.hypot(x + k, y + k) - a, Math.hypot(x - k, y + k) - a);
}
// soft felt / velvet look: gentle volume shading + fine grain + a slightly fuzzy edge
function feltSprite({ w, h, pad = 8, res = 2, sdf, round, col, seed = 1 }) {
  const cw = Math.ceil((w + pad * 2) * res), ch = Math.ceil((h + pad * 2) * res);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d'), img = x.createImageData(cw, ch), D = img.data, R = rng(seed);
  const ox = cw / 2, oy = ch / 2;
  for (let py = 0; py < ch; py++) for (let px = 0; px < cw; px++) {
    const lx = (px - ox) / res, ly = (py - oy) / res, d = sdf(lx, ly);
    if (d > 1.6) continue;
    const e = .8; let gx = sdf(lx + e, ly) - sdf(lx - e, ly), gy = sdf(lx, ly + e) - sdf(lx, ly - e);
    const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
    const depth = clamp(-d / round), nz = Math.sqrt(1 - Math.pow(1 - depth, 2)), k = Math.sqrt(Math.max(0, 1 - nz * nz));
    const lam = clamp(gx * k * -.35 + gy * k * -.62 + nz * .78);
    const s = .8 + .24 * lam - .07 * Math.pow(k, 3) * clamp(gy + .3);
    const grain = 1 + (R() - .5) * .085 + (Math.sin(lx * 1.7 + ly * .4) * Math.sin(ly * 2.1 - lx * .3)) * .012;
    const i = (py * cw + px) * 4;
    D[i] = clamp(col[0] * s * grain, 0, 255); D[i + 1] = clamp(col[1] * s * grain, 0, 255); D[i + 2] = clamp(col[2] * s * grain, 0, 255);
    D[i + 3] = 255 * clamp(.6 - (d + (R() - .5) * 1.6) * .55);
  }
  x.putImageData(img, 0, 0);
  return { c, w: cw / res, h: ch / res };
}
function canvasSprite(w, h, res, fn) {
  const c = document.createElement('canvas'); c.width = w * res; c.height = h * res;
  const x = c.getContext('2d'); x.scale(res, res); fn(x); return { c, w, h };
}
const drawSpr = (s, cx, cy, sc = 1) => g.drawImage(s.c, cx - s.w * sc / 2, cy - s.h * sc / 2, s.w * sc, s.h * sc);

const BODY_COL = [246, 124, 104], HEART_COL = [255, 246, 236];
const SPR = {};
function buildSprites() {
  SPR.body = feltSprite({ w: 440, h: 370, res: 2.2, sdf: (x, y) => sdfBox(x, y, 220, 185, 150), round: 130, col: BODY_COL, seed: 7 });
  SPR.hand = feltSprite({ w: 96, h: 96, res: 2.2, sdf: (x, y) => Math.hypot(x, y) - 46, round: 40, col: BODY_COL, seed: 3 });
  SPR.heart = feltSprite({ w: 160, h: 150, res: 2.2, sdf: (x, y) => sdfHeart(x, y - 6, 42), round: 36, col: HEART_COL, seed: 11 });

  SPR.wrench = canvasSprite(270, 100, 2.5, x => {
    const metal = x.createLinearGradient(0, 30, 0, 72); metal.addColorStop(0, '#F7F2EC'); metal.addColorStop(.5, '#D8CEC5'); metal.addColorStop(1, '#AFA39A');
    x.fillStyle = metal; rr(90, 36, 120, 28, 12, x); x.fill();
    x.beginPath(); x.arc(212, 50, 44, 0, TAU); x.fill();
    x.globalCompositeOperation = 'destination-out';
    x.beginPath(); x.arc(226, 50, 17, 0, TAU); x.fill(); x.fillRect(226, 33, 60, 34);
    x.globalCompositeOperation = 'source-over';
    const grip = x.createLinearGradient(0, 30, 0, 72); grip.addColorStop(0, '#5A8F9E'); grip.addColorStop(1, '#3E6F7D');
    x.fillStyle = grip; rr(8, 32, 112, 36, 18, x); x.fill();
    x.fillStyle = 'rgba(255,255,255,.3)'; rr(20, 37, 86, 7, 4, x); x.fill();
    x.fillStyle = 'rgba(255,255,255,.7)'; rr(122, 40, 70, 4, 2, x); x.fill();
  });
  SPR.pills = canvasSprite(230, 96, 2.5, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(8, 22, 216, 70, 18, x); x.fill();
    x.fillStyle = '#FFFBF4'; rr(4, 14, 216, 70, 18, x); x.fill();
    x.strokeStyle = '#EAD7C4'; x.lineWidth = 2; x.stroke();
    const cols = ['#F4A38C', '#F7C07E', '#F3D77E', '#B6D6A4', '#9DCFCF', '#B7B2E2', '#EBA7C6'], L = 'SMTWTFS';
    x.font = '800 17px Nunito'; x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let i = 0; i < 7; i++) {
      x.fillStyle = cols[i]; rr(14 + i * 29, 22, 25, 54, 8, x); x.fill();
      x.fillStyle = 'rgba(255,255,255,.4)'; rr(17 + i * 29, 25, 19, 8, 4, x); x.fill();
      x.fillStyle = '#fff'; x.fillText(L[i], 26.5 + i * 29, 56);
    }
  });
  SPR.cal = canvasSprite(130, 140, 2.5, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(10, 14, 114, 122, 18, x); x.fill();
    x.fillStyle = '#FFFBF4'; rr(6, 8, 114, 122, 18, x); x.fill();

function frame(t) {

}

  cue(gs + 1.15, [72, 79, 84, 88], .04, .5); cue(gs + 1.15, 48, 0, .55, 'marimba');
  for (let k = 0; k < 12; k++) cue(gs + 2.0 + k * .08, 72 + [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26][k], 0, .22 + k * .02);
  // outro
  const os = SHOTS[12].s;
  cue(os, [48, 60], 0, .55, 'marimba'); cue(os, [72, 76, 79, 84], .05, .5);
  cue(os + .5, [76, 79, 81, 79], .25, .4); cue(os + 1.6, 84, 0, .4);
  cue(os + 3.0, [79, 84], .09, .5); cue(os + 3.4, [84, 88, 91], .06, .4);

function makeGraph(ac) {
  const master = ac.createGain(); master.gain.value = .8;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
  master.connect(comp); comp.connect(ac.destination);
  const verb = ac.createConvolver(), R = rng(9), len = ac.sampleRate * 1.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = .18; verb.connect(wet); wet.connect(master);
  const noise = ac.createBuffer(1, ac.sampleRate * .05, ac.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  return { master, verb, noise };
}
function strike(ac, G, t, midi, vel, kind) {

    : kind === 'block' ? [[1, 1, .06], [2.7, .3, .03]]

  const out = ac.createGain(); out.gain.value = vel * (kind === 'marimba' ? .45 : .32);
  const pan = ac.createStereoPanner(); pan.pan.value = clamp((midi - 74) / 28, -.45, .45);
  out.connect(pan); pan.connect(G.master); if (kind !== 'block') pan.connect(G.verb);
  for (const [r, a, d] of parts) {
    if (f * r > 18000) continue;
    const o = ac.createOscillator(), e = ac.createGain();
    o.frequency.value = f * r;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(a, t + .002); e.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(e); e.connect(out); o.start(t); o.stop(t + d + .05);
  }

  n.buffer = G.noise; bp.type = 'bandpass'; bp.frequency.value = Math.min(12000, f * 2.6); bp.Q.value = 1.2;
  ne.gain.setValueAtTime(kind === 'marimba' ? .2 : .5, t); ne.gain.exponentialRampToValueAtTime(.001, t + .018);
  n.connect(bp); bp.connect(ne); ne.connect(out); n.start(t); n.stop(t + .04);
}

/* ================= boot ================= */
const fontsReady = Promise.all(['600 100px Fredoka', '700 40px Nunito', '800 40px Nunito', '900 40px Nunito', '800 100px "Inter Tight"', '700 100px "Inter Tight"'].map(f => document.fonts.load(f)));
window.__ready = fontsReady.then(() => { buildSprites(); frame(RENDER ? 0 : 29.5); return true; });
window.__frame = t => frame(t);
window.__dur = DUR;
window.__audio = async () => {
  const sr = 48000, ac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  schedule(ac, 0); const buf = await ac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1), ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) { v.setInt16(o, clamp(L[i], -1, 1) * 32767, true); v.setInt16(o + 2, clamp(Rr[i], -1, 1) * 32767, true); }
  let s = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(s);
};

if (!RENDER) {
  const ui = document.getElementById('ui'), bar = document.getElementById('bar');
  let ac = null, base = 0, raf = 0;
  const loop = () => {
    const t = ac.currentTime - base;
    frame(clamp(t, 0, DUR)); bar.style.width = (100 * clamp(t / DUR)) + '%';
    if (t < DUR) raf = requestAnimationFrame(loop); else { ui.classList.remove('hide'); ac.close(); ac = null; }
  };
  const start = async () => {
    await window.__ready;
    if (ac) { if (ac.state === 'running') { await ac.suspend(); ui.classList.remove('hide'); } else { await ac.resume(); ui.classList.add('hide'); } return; }
    ac = new AudioContext(); base = ac.currentTime + .15; schedule(ac, base); ui.classList.add('hide');
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  };
  ui.addEventListener('click', start);
  cv.addEventListener('click', () => { if (ac) start(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); start(); } });
}
})();
