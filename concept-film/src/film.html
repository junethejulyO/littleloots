<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bondi for Mom &amp; Dad</title>
<style>
/*FONTS*/
:root{--bg:#F6ECE0;--ink:#3A2419}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1512;--ink:#F6ECE0}}
:root[data-theme="dark"]{--bg:#1E1512;--ink:#F6ECE0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw - 32px,(100vh - 32px)*16/9);aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(120,60,30,.25)}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(58,36,25,.08);transition:opacity .3s}
#ui.hide{opacity:0;pointer-events:none}
#ui button{all:unset;cursor:pointer;width:clamp(56px,9vw,110px);aspect-ratio:1;border-radius:50%;background:#F27A63;box-shadow:0 12px 40px rgba(242,122,99,.45);display:grid;place-items:center}
#ui button svg{width:38%;margin-left:8%}
#bar{position:absolute;left:0;bottom:0;height:4px;background:#F27A63;width:0}
body.render #stage{width:1920px;height:1080px;border-radius:0;box-shadow:none}
body.render #ui,body.render #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui"><button aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></button></div>
  <div id="bar"></div>
</div>
<script>
(() => {
const W = 1920, H = 1080, DUR = 34;
const RENDER = location.search.includes('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c'); let g = cv.getContext('2d');

/* ================= utils ================= */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const popIn = (lt, t0, d = .35) => E.outBack(seg(lt, t0, t0 + d));
function rr(x, y, w, h, r, ctx = g) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

const INK = '#3A2419', INK2 = '#8A6A58', CORAL = '#F27A63', SAGE = '#6FAE84', AMBER = '#FFB061';
const HEAD = '"Inter Tight", Inter, system-ui, sans-serif';

/* ================= sprites ================= */
function sdfBox(x, y, bx, by, r) { const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }
function sdfHeart(x, y, a) {
  y += a * .15;
  const u = (x + y) / Math.SQRT2, v = (y - x) / Math.SQRT2, k = a / Math.SQRT2;
  return Math.min(sdfBox(u, v, a, a, a * .22), Math.hypot(x + k, y + k) - a, Math.hypot(x - k, y + k) - a);
}
// soft felt / velvet look: gentle volume shading + fine grain + a slightly fuzzy edge
function feltSprite({ w, h, pad = 8, res = 2, sdf, round, col, seed = 1 }) {
  const cw = Math.ceil((w + pad * 2) * res), ch = Math.ceil((h + pad * 2) * res);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d'), img = x.createImageData(cw, ch), D = img.data, R = rng(seed);
  const ox = cw / 2, oy = ch / 2;
  for (let py = 0; py < ch; py++) for (let px = 0; px < cw; px++) {
    const lx = (px - ox) / res, ly = (py - oy) / res, d = sdf(lx, ly);
    if (d > 1.6) continue;
    const e = .8; let gx = sdf(lx + e, ly) - sdf(lx - e, ly), gy = sdf(lx, ly + e) - sdf(lx, ly - e);
    const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
    const depth = clamp(-d / round), nz = Math.sqrt(1 - Math.pow(1 - depth, 2)), k = Math.sqrt(Math.max(0, 1 - nz * nz));
    const lam = clamp(gx * k * -.35 + gy * k * -.62 + nz * .78);
    const s = .8 + .24 * lam - .07 * Math.pow(k, 3) * clamp(gy + .3);
    const grain = 1 + (R() - .5) * .085 + (Math.sin(lx * 1.7 + ly * .4) * Math.sin(ly * 2.1 - lx * .3)) * .012;
    const i = (py * cw + px) * 4;
    D[i] = clamp(col[0] * s * grain, 0, 255); D[i + 1] = clamp(col[1] * s * grain, 0, 255); D[i + 2] = clamp(col[2] * s * grain, 0, 255);
    D[i + 3] = 255 * clamp(.6 - (d + (R() - .5) * 1.6) * .55);
  }
  x.putImageData(img, 0, 0);
  return { c, w: cw / res, h: ch / res };
}
function canvasSprite(w, h, res, fn) {
  const c = document.createElement('canvas'); c.width = w * res; c.height = h * res;
  const x = c.getContext('2d'); x.scale(res, res); fn(x); return { c, w, h };
}
const drawSpr = (s, cx, cy, sc = 1) => g.drawImage(s.c, cx - s.w * sc / 2, cy - s.h * sc / 2, s.w * sc, s.h * sc);

const BODY_COL = [246, 124, 104], HEART_COL = [255, 246, 236];
const SPR = {};
function buildSprites() {
  SPR.body = feltSprite({ w: 440, h: 370, res: 2.2, sdf: (x, y) => sdfBox(x, y, 220, 185, 150), round: 130, col: BODY_COL, seed: 7 });
  SPR.hand = feltSprite({ w: 96, h: 96, res: 2.2, sdf: (x, y) => Math.hypot(x, y) - 46, round: 40, col: BODY_COL, seed: 3 });
  SPR.heart = feltSprite({ w: 160, h: 150, res: 2.2, sdf: (x, y) => sdfHeart(x, y - 6, 42), round: 36, col: HEART_COL, seed: 11 });

  SPR.wrench = canvasSprite(270, 100, 2.5, x => {
    const metal = x.createLinearGradient(0, 30, 0, 72); metal.addColorStop(0, '#F7F2EC'); metal.addColorStop(.5, '#D8CEC5'); metal.addColorStop(1, '#AFA39A');
    x.fillStyle = metal; rr(90, 36, 120, 28, 12, x); x.fill();
    x.beginPath(); x.arc(212, 50, 44, 0, TAU); x.fill();
    x.globalCompositeOperation = 'destination-out';
    x.beginPath(); x.arc(226, 50, 17, 0, TAU); x.fill(); x.fillRect(226, 33, 60, 34);
    x.globalCompositeOperation = 'source-over';
    const grip = x.createLinearGradient(0, 30, 0, 72); grip.addColorStop(0, '#5A8F9E'); grip.addColorStop(1, '#3E6F7D');
    x.fillStyle = grip; rr(8, 32, 112, 36, 18, x); x.fill();
    x.fillStyle = 'rgba(255,255,255,.3)'; rr(20, 37, 86, 7, 4, x); x.fill();
    x.fillStyle = 'rgba(255,255,255,.7)'; rr(122, 40, 70, 4, 2, x); x.fill();
  });
  SPR.pills = canvasSprite(230, 96, 2.5, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(8, 22, 216, 70, 18, x); x.fill();
    x.fillStyle = '#FFFBF4'; rr(4, 14, 216, 70, 18, x); x.fill();
    x.strokeStyle = '#EAD7C4'; x.lineWidth = 2; x.stroke();
    const cols = ['#F4A38C', '#F7C07E', '#F3D77E', '#B6D6A4', '#9DCFCF', '#B7B2E2', '#EBA7C6'], L = 'SMTWTFS';
    x.font = '800 17px Nunito'; x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let i = 0; i < 7; i++) {
      x.fillStyle = cols[i]; rr(14 + i * 29, 22, 25, 54, 8, x); x.fill();
      x.fillStyle = 'rgba(255,255,255,.4)'; rr(17 + i * 29, 25, 19, 8, 4, x); x.fill();
      x.fillStyle = '#fff'; x.fillText(L[i], 26.5 + i * 29, 56);
    }
  });
  SPR.cal = canvasSprite(130, 140, 2.5, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(10, 14, 114, 122, 18, x); x.fill();
    x.fillStyle = '#FFFBF4'; rr(6, 8, 114, 122, 18, x); x.fill();
    x.save(); rr(6, 8, 114, 122, 18, x); x.clip(); x.fillStyle = CORAL; x.fillRect(6, 8, 114, 36); x.restore();
    x.fillStyle = '#fff'; x.font = '900 18px Nunito'; x.textAlign = 'center'; x.fillText('THU', 63, 33);
    x.fillStyle = INK; x.font = '600 58px Fredoka'; x.fillText('16', 63, 104);
  });
  SPR.shield = canvasSprite(140, 160, 2.5, x => {
    const p = new Path2D('M70 10 C95 24 112 26 128 26 C128 82 112 124 70 150 C28 124 12 82 12 26 C28 26 45 24 70 10Z');
    x.fillStyle = 'rgba(160,90,60,.2)'; x.save(); x.translate(4, 6); x.fill(p); x.restore();
    const gr = x.createLinearGradient(0, 10, 0, 150); gr.addColorStop(0, '#FFFDF8'); gr.addColorStop(1, '#F3E3D1');
    x.fillStyle = gr; x.fill(p); x.strokeStyle = CORAL; x.lineWidth = 9; x.lineJoin = 'round'; x.stroke(p);
    x.strokeStyle = SAGE; x.lineWidth = 13; x.lineCap = 'round';
    x.beginPath(); x.moveTo(44, 78); x.lineTo(63, 98); x.lineTo(98, 58); x.stroke();
  });
  SPR.umbrella = canvasSprite(240, 240, 2.5, x => {
    x.strokeStyle = '#5A3A2A'; x.lineWidth = 7; x.lineCap = 'round';
    x.beginPath(); x.moveTo(120, 90); x.lineTo(120, 205); x.arc(104, 205, 16, 0, Math.PI); x.stroke();
    const N = 5, R0 = 110;
    for (let i = 0; i < N; i++) {
      const a0 = Math.PI + i * Math.PI / N, a1 = a0 + Math.PI / N;
      x.fillStyle = i % 2 ? '#FFF4E6' : '#F5A04A';
      x.beginPath(); x.moveTo(120, 112); x.arc(120, 112, R0, a0, a1);
      const mx = 120 + Math.cos((a0 + a1) / 2) * R0 * .82, my = 112 + Math.sin((a0 + a1) / 2) * R0 * .1 + 8;
      x.quadraticCurveTo(mx, my, 120 + Math.cos(a0) * R0, 112 + Math.sin(a0) * R0); x.closePath(); x.fill();
    }
    x.fillStyle = '#5A3A2A'; x.beginPath(); x.arc(120, 6, 6, 0, TAU); x.fill();
  });
  SPR.gift = canvasSprite(170, 170, 2.5, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(22, 70, 132, 98, 14, x); x.fill();
    x.fillStyle = '#9DCFCF'; rr(18, 64, 132, 98, 14, x); x.fill();
    x.fillStyle = '#B4DCDC'; rr(10, 44, 148, 34, 12, x); x.fill();
    x.fillStyle = CORAL; x.fillRect(74, 44, 20, 118);
    x.beginPath(); x.ellipse(66, 34, 24, 14, -.5, 0, TAU); x.ellipse(102, 34, 24, 14, .5, 0, TAU); x.fill();
    x.fillStyle = '#D9533F'; x.beginPath(); x.arc(84, 40, 10, 0, TAU); x.fill();
  });
  SPR.bag = canvasSprite(180, 210, 2.5, x => {
    x.fillStyle = '#C79A6C'; x.beginPath(); x.moveTo(30, 70); x.lineTo(150, 70); x.lineTo(162, 200); x.lineTo(18, 200); x.closePath(); x.fill();
    x.fillStyle = '#DDB487'; x.beginPath(); x.moveTo(30, 70); x.lineTo(150, 70); x.lineTo(156, 120); x.lineTo(24, 120); x.closePath(); x.fill();
    x.strokeStyle = '#A97C52'; x.lineWidth = 6; x.beginPath(); x.arc(90, 70, 30, Math.PI, 0); x.stroke();
    x.fillStyle = '#fff'; rr(64, 140, 52, 40, 10, x); x.fill(); x.fillStyle = CORAL; x.beginPath(); x.arc(90, 160, 10, 0, TAU); x.fill();
  });
}

/* ================= Bondi ================= */
// body-local units: 440 wide, origin at bottom centre. Props are held in the right hand (viewer's right).
const PROP = {
  pills: { ax: -84, ay: 22, rot: -.25 },
  wrench: { ax: -85, ay: 0, rot: -.9 },
  cal: { ax: -26, ay: 76, rot: .1 },
  shield: { ax: -22, ay: 84, rot: .08 },
  umbrella: { ax: 0, ay: 85, rot: -.8 },
  heart: { ax: -52, ay: 8, rot: .12 },
  gift: { ax: -20, ay: 60, rot: .06 },
  bag: { ax: -10, ay: 80, rot: .05 },
};
function blinkAt(t) { const p = (t + 1.3) % 2.9; return p < .16 ? Math.sin(p / .16 * Math.PI) : 0; }
function drawBondi(x, by, size, st = {}) {
  const t = st.t ?? 0, k = size / 440, breath = Math.sin(t * 3) * .012, yy = st.y || 0;
  g.save(); g.translate(x, by + yy);
  g.scale(k * (st.sx || 1) * (1 - breath * .5), k * (st.sy || 1) * (1 + breath));
  if (st.shadow !== false) { g.fillStyle = 'rgba(110,50,30,.16)'; g.beginPath(); g.ellipse(0, 6 - yy / k, 205 * (1 - clamp(-yy / k / 600) * .5), 22, 0, 0, TAU); g.fill(); }
  const lw = st.waveL || 0, bob = Math.sin(t * 3 + 1) * 4;
  const lh = [lerp(-236, -262 + Math.sin(t * 16) * 12, lw), lerp(-118 + bob, -292, lw)];
  drawSpr(SPR.body, 0, -185);
  drawSpr(SPR.hand, lh[0], lh[1]);
  // eyes
  const look = st.look || 0, happy = st.happy || 0, bl = st.blink ?? blinkAt(t);
  for (const ex of [-62, 62]) {
    const X = ex + 8 + look * 22, Y = -176 + (st.lookY || 0) * 10;
    if (happy > .5) {
      g.strokeStyle = '#1B1210'; g.lineWidth = 15; g.lineCap = 'round';
      g.beginPath(); g.arc(X, Y + 14, 26, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
    } else drawEye(X, Y, 30, 54 * Math.max(.07, 1 - bl * .94) * (st.squint || 1));
  }
  // right hand + prop
  const rw = st.waveR || 0;
  let rh = [lerp(236, 262 + Math.sin(t * 16) * 12, rw), lerp(-118 - bob, -292, rw)];
  if (st.prop) {
    const sp = PROP[st.prop], pk = st.propK ?? 1;
    rh = [lerp(rh[0], 248, clamp(pk)) + (st.handDX || 0), lerp(rh[1], -150, clamp(pk)) + (st.handDY || 0)];
    if (pk > 0) {
      g.save(); g.translate(rh[0], rh[1]); g.rotate(sp.rot + (st.propRot || 0)); const s = pk * (st.propS || 1); g.scale(s, s);
      const sp2 = SPR[st.prop]; g.drawImage(sp2.c, -sp.ax - sp2.w / 2, -sp.ay - sp2.h / 2, sp2.w, sp2.h); g.restore();
    }
  }
  drawSpr(SPR.hand, rh[0], rh[1]);
  // "noticed" rays (upper left of the head)
  if (st.rays > 0 && st.rays < 1) {
    const p = st.rays, grow = E.outBack(seg(p, 0, .3)), fade = 1 - seg(p, .7, 1);
    g.save(); g.translate(-215, -352); g.scale(-1, 1); g.strokeStyle = AMBER; g.lineCap = 'round'; g.lineWidth = 14;
    g.shadowColor = 'rgba(255,170,90,.9)'; g.shadowBlur = 20; g.globalAlpha = fade;
    [-80, -42, -6].forEach((deg, i) => { const a = deg * Math.PI / 180, d0 = 50 + p * 18, L = (30 + (i === 1 ? 6 : 0)) * grow; g.beginPath(); g.moveTo(Math.cos(a) * d0, Math.sin(a) * d0); g.lineTo(Math.cos(a) * (d0 + L), Math.sin(a) * (d0 + L)); g.stroke(); });
    g.restore();
  }
  g.restore();
}
function drawEye(x, y, rx, ry) {
  g.save(); g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fillStyle = '#1B1210'; g.fill(); g.clip();
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1.6;
  for (let i = -70; i < 70; i += 4) { g.beginPath(); g.moveTo(x + i, y - 70); g.lineTo(x + i + 26, y + 70); g.stroke(); }
  g.restore();
}
function landing(lt, t0, height = 420, dur = .32) {
  if (lt < t0) return { y: -9999, sx: 1, sy: 1 };
  if (lt < t0 + dur) { const p = seg(lt, t0, t0 + dur); return { y: -height * (1 - p * p), sx: .92, sy: 1.1 }; }
  const p = seg(lt, t0 + dur, t0 + dur + .55), sq = .2 * Math.exp(-5 * p) * Math.cos(p * Math.PI * 3.2);
  return { y: 0, sx: 1 + sq * .8, sy: 1 - sq };
}
function hop(lt, t0, h = 60, d = .3) {
  if (lt < t0 - .1 || lt > t0 + d + .45) return { y: 0, sx: 1, sy: 1 };
  if (lt < t0) { const p = seg(lt, t0 - .1, t0); return { y: 0, sx: 1 + .08 * p, sy: 1 - .1 * p }; }
  if (lt < t0 + d) { const p = seg(lt, t0, t0 + d); return { y: -h * 4 * p * (1 - p), sx: .95, sy: 1.06 }; }
  const p = seg(lt, t0 + d, t0 + d + .45), sq = .14 * Math.exp(-5 * p) * Math.cos(p * Math.PI * 3);
  return { y: 0, sx: 1 + sq * .8, sy: 1 - sq };
}

/* ================= the photo frame (product, in 3D) ================= */
// The front face is rendered flat to an offscreen canvas, then drawn in vertical strips with perspective.
const FW = 1600, FH = 1248, RIM = 48, MAT = 72, SX = RIM + MAT, SY = RIM + MAT, SWD = FW - 2 * SX, SHD = FH - 2 * SY;
const DEV = document.createElement('canvas'); DEV.width = FW; DEV.height = FH;
const dg = DEV.getContext('2d');
function renderFace(content, on = 1, sweep = -1) {
  const prev = g; g = dg;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, FW, FH);
  const al = g.createLinearGradient(0, 0, FW, FH); al.addColorStop(0, '#F5F3EF'); al.addColorStop(.5, '#DFDBD5'); al.addColorStop(1, '#C3BEB7');
  g.fillStyle = al; rr(0, 0, FW, FH, 64); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 4; rr(6, 6, FW - 12, FH - 12, 58); g.stroke();
  g.fillStyle = '#FBFAF7'; rr(RIM, RIM, FW - 2 * RIM, FH - 2 * RIM, 20); g.fill();
  const ms = g.createLinearGradient(0, RIM, 0, RIM + 40); ms.addColorStop(0, 'rgba(0,0,0,.10)'); ms.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = ms; g.fillRect(RIM, RIM, FW - 2 * RIM, 40);
  g.save(); rr(SX, SY, SWD, SHD, 10); g.clip();
  g.fillStyle = '#0C0C0E'; g.fillRect(SX, SY, SWD, SHD);
  if (on > 0) { g.globalAlpha = on; const k = SWD / 800; g.translate(SX, SY); g.scale(k, k); g.translate(0, (SHD / k - 600) / 2); content(); }
  g.restore(); g.globalAlpha = 1;
  g.save(); rr(SX, SY, SWD, SHD, 10); g.clip();
  const sg = g.createLinearGradient(SX, SY, SX + SWD, SY + SHD);
  sg.addColorStop(0, 'rgba(255,255,255,.16)'); sg.addColorStop(.35, 'rgba(255,255,255,.04)'); sg.addColorStop(.36, 'rgba(255,255,255,0)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sg; g.fillRect(SX, SY, SWD, SHD); g.restore();
  g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 3; rr(SX, SY, SWD, SHD, 10); g.stroke();
  if (sweep > -.5 && sweep < 1.5) { // a light sweep across the aluminium
    g.save(); rr(0, 0, FW, FH, 64); g.clip(); g.globalCompositeOperation = 'lighter';
    const x = lerp(-FW * .6, FW * 1.6, sweep), sw = g.createLinearGradient(x - 260, 0, x + 260, FH * .4);
    sw.addColorStop(0, 'rgba(255,255,255,0)'); sw.addColorStop(.5, 'rgba(255,255,255,.35)'); sw.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sw; g.fillRect(0, 0, FW, FH); g.restore();
  }
  g = prev;
}
function drawDevice(cx, cy, w, ang, content, o = {}) {
  renderFace(content, o.on ?? 1, o.sweep ?? -1);
  const h = w * FH / FW, f = w * 2.6, d = w * .035, N = 96, ca = Math.cos(ang), sa = Math.sin(ang);
  const P = (u, v, s) => { const x = u * ca - s * sa, z = u * sa + s * ca, k = f / (f + z); return [cx + x * k, cy + v * k, k]; };
  if (o.floor === 'shadow') {
    g.save(); g.translate(cx, cy + h * .53); g.scale(1, .09);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, w * .6); gr.addColorStop(0, 'rgba(0,0,0,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(-w, -w, 2 * w, 2 * w); g.restore();
  }
  const strips = refl => {
    for (let i = 0; i < N; i++) {

  { h: 'Never misses a pill.', s: 'Gentle reminders, right on time.', dark: false, scr: scrReminds, ang: [.2, .05] },
  { h: 'Fixes the Wi-Fi.', s: 'Before Dad even notices.', dark: true, scr: scrFixes, ang: [-.2, -.05] },
  { h: 'Stops scams cold.', s: 'Suspicious calls never get through.', dark: false, scr: scrProtects, ang: [.18, .03] },
  { h: 'Books the doctor. And the ride.', s: 'Then lets the family know.', dark: false, scr: scrBooks, ang: [-.18, -.03] },
  { h: 'Sees the rain coming.', s: 'The umbrella is already by the door.', dark: true, scr: scrPlans, ang: [.2, .05] },
  { h: 'Calls Lily when she’s free.', s: 'Family, always within reach.', dark: false, scr: scrConnects, ang: [-.18, -.03] },
];
const FEAT_T0 = 8, LAG = .45;
FEAT.forEach((f, i) => addShot(FEAT_T0 + i * BAR, FEAT_T0 + (i + 1) * BAR, (t, lt) => {
  fill(f.dark ? '#000' : (i % 2 ? '#FFFFFF' : LIGHT));
  if (f.dark) glow(960, 640, 760, 'rgba(242,122,99,.22)');
  aText(f.h, 960, 178, 78, lt, .05, { color: f.dark ? '#F5F5F7' : TXT });
  aText(f.s, 960, 244, 34, lt, .25, { color: GRAY, weight: 500, ls: 0 });
  const p = E.outCubic(seg(lt, 0, BAR));
  drawDevice(960, 672 + (1 - E.outCubic(seg(lt, 0, .8))) * 40, 850 * (1 + p * .05), lerp(f.ang[0], f.ang[1], p), () => f.scr(lt - LAG, t), { floor: f.dark ? 'reflect' : 'shadow', reflLen: .25 });
}));
// 23 – 28  bento grid
const TILES = [['pills', 'Pill reminders', 'On time, every time'], ['wrench', 'Home tech fixes', 'Wi-Fi, TV, settings'], ['shield', 'Scam shield', 'Blocks bad calls'], ['cal', 'Appointments', 'Doctor and rides'],
  ['umbrella', 'Weather heads-up', 'Plans around rain'], ['bag', 'Groceries', 'Before the fridge is bare'], ['gift', 'Birthdays', 'Never forgotten'], ['heart', 'Family calls', 'When everyone is free']];
const BENTO = (() => {
  const tw = 360, th = 262, gp = 22, x0 = (W - (tw * 4 + gp * 3)) / 2, y0 = (H - (th * 3 + gp * 2)) / 2;
  const cell = (c, r, cw = 1, rh = 1) => [x0 + c * (tw + gp), y0 + r * (th + gp), tw * cw + gp * (cw - 1), th * rh + gp * (rh - 1)];
  return { big: cell(0, 0, 2, 2), small: [cell(2, 0), cell(3, 0), cell(2, 1), cell(3, 1), cell(0, 2), cell(1, 2), cell(2, 2), cell(3, 2)] };
})();
addShot(23, 28, (t, lt) => {
  fill(LIGHT);
  const z = 1.05 - E.outCubic(seg(lt, 0, 5)) * .05;
  g.save(); g.translate(960, 540); g.scale(z, z); g.translate(-960, -540);
  const tile = ([x, y, w, h], k, fn) => {
    if (k <= 0) return; const e = E.outCubic(k);
    g.save(); g.globalAlpha = e; g.translate(0, (1 - e) * 40);
    g.shadowColor = 'rgba(0,0,0,.06)'; g.shadowBlur = 30; g.shadowOffsetY = 8; g.fillStyle = '#FFFFFF'; rr(x, y, w, h, 28); g.fill(); g.shadowColor = 'transparent';
    g.save(); rr(x, y, w, h, 28); g.clip(); fn(x, y, w, h); g.restore(); g.restore();
  };
  tile(BENTO.big, seg(lt, .05, .7), (x, y, w, h) => {
    const gr = g.createLinearGradient(x, y, x, y + h); gr.addColorStop(0, '#FFF6EC'); gr.addColorStop(1, '#FBE3CF'); g.fillStyle = gr; g.fillRect(x, y, w, h);
    glow(x + w / 2, y + h * .72, 360, 'rgba(255,190,120,.45)');
    drawBondi(x + w / 2, y + h - 40, 360, { t, prop: 'heart', propK: 1, waveL: seg(lt, .8, 1) * (1 - seg(lt, 2.4, 2.6)), happy: lt > 3 && lt < 3.8 ? 1 : 0 });
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.font = `700 54px ${HEAD}`; g.letterSpacing = '-1.2px';
    g.fillStyle = TXT; g.fillText('Always one', x + 44, y + 84);
    const gw = g.measureText('step ahead.').width, gg = g.createLinearGradient(x + 44, 0, x + 44 + gw, 0); GRAD.forEach((c, i) => gg.addColorStop(i / 2, c));
    g.fillStyle = gg; g.fillText('step ahead.', x + 44, y + 144);
  });
  BENTO.small.forEach((r, i) => tile(r, seg(lt, .3 + i * .08, .95 + i * .08), (x, y, w, h) => {
    const [name, label, cap] = TILES[i], s = SPR[name], f = Math.min(130 / s.w, 110 / s.h);
    g.drawImage(s.c, x + 34, y + 30 + (110 - s.h * f) / 2, s.w * f, s.h * f);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = TXT; g.font = `700 30px ${HEAD}`; g.letterSpacing = '-.5px'; g.fillText(label, x + 34, y + h - 62);
    g.fillStyle = GRAY; g.font = `500 21px ${HEAD}`; g.letterSpacing = '0px'; g.fillText(cap, x + 34, y + h - 30);
  }));
  g.restore();
});
// 28 – 34  end card
addShot(28, 34, (t, lt) => {
  fill('#000');
  glow(960, 420, 820, 'rgba(242,122,99,.26)');
  drawDevice(960, 410, 800, lerp(-.32, -.04, E.inOut(seg(lt, 0, 3))), () => {
    screenBG();
    drawBondi(400, 545, 380, { t, prop: 'heart', propK: popIn(lt, .6), waveL: seg(lt, 1.2, 1.4) * (1 - seg(lt, 3, 3.2)), happy: lt > 3.4 && lt < 4.4 ? 1 : 0, rays: seg(lt, 3.2, 4.2), ...hop(lt, 3.4, 40) });
  }, { floor: 'reflect', reflLen: .18 });
  aText('Bondi', 960, 900, 120, lt, 1.0, { grad: GRAD });
  aText('Founder Edition', 960, 966, 40, lt, 1.4, { color: '#A1A1A6', weight: 600, ls: 0 });
  aText('heybondi.ai', 960, 1030, 28, lt, 1.8, { color: '#F5F5F7', weight: 600, ls: 0 });
});

/* ================= compositor ================= */
function frame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none'; g.letterSpacing = '0px'; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.shadowColor = 'transparent';
  let sh = SHOTS.find(s => t >= s.s && t < s.e) || SHOTS[SHOTS.length - 1];
  const lt = t - sh.s, z = 1 + .025 * (1 - E.outCubic(seg(lt, 0, .7)));
  g.save(); g.translate(960, 540); g.scale(z, z); g.translate(-960, -540); sh.draw(t, lt); g.restore();
  const f = seg(t, DUR - .9, DUR);
  if (f > 0) { g.fillStyle = `rgba(0,0,0,${f})`; g.fillRect(0, 0, W, H); }
}

/* ================= sound: xylophone & marimba ================= */
const CUES = [];
const cue = (t, notes, step = 0, vel = .6, kind = 'xylo') => (Array.isArray(notes) ? notes : [notes]).forEach((n, i) => CUES.push([t + i * step, n, vel, kind]));
(function buildCues() {
  const BEAT = BAR / 4;
  // opening line
  cue(.25, [72, 79], .12, .22); cue(.25, 48, 0, .28, 'marimba');
  // reveal
  cue(1.8, [48, 55, 60], .12, .3, 'marimba'); cue(2.1, [91, 93, 96], .09, .1);
  cue(3.0, [60, 64, 67, 72, 76], .05, .45); cue(3.0, 48, 0, .5, 'marimba');
  cue(3.65, [79, 84], .09, .45); cue(4.0, [88, 91, 88, 91], .12, .18);
  cue(4.2, [72, 76, 79, 84], .07, .38);
  // statement, a note per word
  [76, 79, 81, 84, 88, 91].forEach((n, i) => cue(5.6 + i * .18, n, 0, .36));
  // groove from 3.0 to 28: C – Am – F – G
  const CH = [[48, 64, 67, 72], [45, 60, 64, 69], [41, 60, 65, 69], [43, 59, 62, 67]];
  for (let bar = 0; bar < 10; bar++) {
    const t0 = 3 + bar * BAR, ch = CH[bar % 4], soft = bar < 2 ? .6 : 1;
    cue(t0, ch[0] + 12, 0, .42 * soft, 'marimba'); cue(t0 + 2 * BEAT, ch[0] + 12, 0, .3 * soft, 'marimba'); cue(t0 + 3.5 * BEAT, ch[0] + 19, 0, .2 * soft, 'marimba');
    [1, 3].forEach(b => cue(t0 + b * BEAT, 98, 0, .07 * soft, 'block'));
    for (let e = 0; e < 8; e++) cue(t0 + e * BEAT / 2, ch[1 + (e % 3)] + 12, 0, (e % 2 ? .06 : .09) * soft);
  }
  // capability shots
  const stab = [[72, 76, 79], [74, 77, 81], [72, 76, 79], [77, 81, 84], [74, 77, 81], [79, 83, 86]];
  FEAT.forEach((f, i) => cue(FEAT_T0 + i * BAR, stab[i], .02, .38));
  const at = (i, lt) => FEAT_T0 + i * BAR + LAG + lt;
  cue(at(0, .3), [84, 88], .07, .3); cue(at(0, 1.0), [84, 88, 91], .06, .42);
  for (let k = 0; k < 4; k++) cue(at(1, .25 + k * .2), k % 2 ? 93 : 91, 0, .26);
  cue(at(1, .95), [79, 84, 88], .1, .4); cue(at(1, 1.15), [84, 88], .07, .3);
  for (let k = 0; k < 6; k++) cue(at(2, .05 + k * .06), k % 2 ? 84 : 88, 0, .13);
  cue(at(2, .75), 55, 0, .5, 'marimba'); cue(at(2, .78), [79, 84, 91], .05, .42);
  cue(at(3, .45), [72, 76, 79, 83, 86], .08, .24); cue(at(3, .9), [84, 88], .06, .32); cue(at(3, 1.15), [86, 91], .06, .32);
  cue(at(4, .25), [67, 74, 79, 86], .05, .34); cue(at(4, .75), [84, 88], .07, .28);
  cue(at(5, .15), [76, 79], .1, .3); cue(at(5, .55), [84, 88, 91], .06, .36);
  // bento tiles
  cue(23.05, [60, 72], 0, .4, 'marimba');
  [0, 1, 2, 3, 4, 5, 6, 7].forEach(i => cue(23.3 + i * .08, [72, 74, 76, 79, 81, 84, 86, 88][i], 0, .24));
  // end card
  cue(28, [48, 55, 60, 64], .04, .5, 'marimba'); cue(28, [72, 76, 79, 84, 88, 91, 96], .07, .36);
  cue(29.0, [84, 88], .1, .32); cue(31.2, [79, 84], .09, .36); cue(31.6, [88, 91, 96], .08, .22);
})();

function makeGraph(ac) {
  const master = ac.createGain(); master.gain.value = .8;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
  master.connect(comp); comp.connect(ac.destination);
  const verb = ac.createConvolver(), R = rng(9), len = ac.sampleRate * 1.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = .18; verb.connect(wet); wet.connect(master);
  const noise = ac.createBuffer(1, ac.sampleRate * .05, ac.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  return { master, verb, noise };
}
function strike(ac, G, t, midi, vel, kind) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const parts = kind === 'xylo' ? [[1, 1, Math.min(1.1, .65 * Math.sqrt(1046 / f))], [3.0, .26, .2], [6.27, .08, .06]]
    : kind === 'block' ? [[1, 1, .06], [2.7, .3, .03]]
    : [[1, 1, 1.2], [4.0, .1, .3], [9.9, .025, .06]];
  const out = ac.createGain(); out.gain.value = vel * (kind === 'marimba' ? .45 : .32);
  const pan = ac.createStereoPanner(); pan.pan.value = clamp((midi - 74) / 28, -.45, .45);
  out.connect(pan); pan.connect(G.master); if (kind !== 'block') pan.connect(G.verb);
  for (const [r, a, d] of parts) {
    if (f * r > 18000) continue;
    const o = ac.createOscillator(), e = ac.createGain();
    o.frequency.value = f * r;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(a, t + .002); e.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(e); e.connect(out); o.start(t); o.stop(t + d + .05);
  }
  const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), ne = ac.createGain();
  n.buffer = G.noise; bp.type = 'bandpass'; bp.frequency.value = Math.min(12000, f * 2.6); bp.Q.value = 1.2;
  ne.gain.setValueAtTime(kind === 'marimba' ? .2 : .5, t); ne.gain.exponentialRampToValueAtTime(.001, t + .018);
  n.connect(bp); bp.connect(ne); ne.connect(out); n.start(t); n.stop(t + .04);
}
function schedule(ac, base) { const G = makeGraph(ac); for (const [t, m, v, k] of CUES) strike(ac, G, base + t, m, v, k); }

/* ================= boot ================= */
const fontsReady = Promise.all(['600 100px Fredoka', '700 40px Nunito', '800 40px Nunito', '900 40px Nunito', '800 100px "Inter Tight"', '700 100px "Inter Tight"'].map(f => document.fonts.load(f)));
window.__ready = fontsReady.then(() => { buildSprites(); frame(RENDER ? 0 : 30.5); return true; });
window.__frame = t => frame(t);
window.__dur = DUR;
window.__audio = async () => {
  const sr = 48000, ac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  schedule(ac, 0); const buf = await ac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1), ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) { v.setInt16(o, clamp(L[i], -1, 1) * 32767, true); v.setInt16(o + 2, clamp(Rr[i], -1, 1) * 32767, true); }
  let s = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(s);
};

if (!RENDER) {
  const ui = document.getElementById('ui'), bar = document.getElementById('bar');
  let ac = null, base = 0, raf = 0;
  const loop = () => {
    const t = ac.currentTime - base;
    frame(clamp(t, 0, DUR)); bar.style.width = (100 * clamp(t / DUR)) + '%';
    if (t < DUR) raf = requestAnimationFrame(loop); else { ui.classList.remove('hide'); ac.close(); ac = null; }
  };
  const start = async () => {
    await window.__ready;
    if (ac) { if (ac.state === 'running') { await ac.suspend(); ui.classList.remove('hide'); } else { await ac.resume(); ui.classList.add('hide'); } return; }
    ac = new AudioContext(); base = ac.currentTime + .15; schedule(ac, base); ui.classList.add('hide');
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  };
  ui.addEventListener('click', start);
  cv.addEventListener('click', () => { if (ac) start(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); start(); } });
}
})();
