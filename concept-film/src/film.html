<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bondi for Mom &amp; Dad</title>
<style>
/*FONTS*/
:root{--bg:#F6ECE0;--ink:#4A2E22;--coral:#EE6A55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1512;--ink:#F6ECE0}}
:root[data-theme="dark"]{--bg:#1E1512;--ink:#F6ECE0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;width:min(100vw - 32px,(100vh - 32px)*16/9);aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(120,60,30,.25)}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(74,46,34,.08);transition:opacity .3s}
#ui.hide{opacity:0;pointer-events:none}
#ui button{all:unset;cursor:pointer;width:clamp(56px,9vw,110px);aspect-ratio:1;border-radius:50%;background:#EE6A55;box-shadow:0 12px 40px rgba(238,106,85,.45);display:grid;place-items:center}
#ui button svg{width:38%;margin-left:8%}
#bar{position:absolute;left:0;bottom:0;height:4px;background:#EE6A55;width:0}
body.render #stage{width:1920px;height:1080px;border-radius:0;box-shadow:none}
body.render #ui,body.render #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui"><button aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></button></div>
  <div id="bar"></div>
</div>
<script>
(() => {
const W = 1920, H = 1080, DUR = 52;
const RENDER = location.search.includes('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c'), g = cv.getContext('2d');

/* ---------------- utils ---------------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inBack: t => { const c1 = 1.7, c3 = c1 + 1; return c3 * t * t * t - c1 * t * t; },
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// keyframe track with eased segments
function track(keys) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return lerp(v0, v1, E.inOut(seg(t, t0, t1))); }
    }
    return keys[keys.length - 1][1];
  };
}
// pop in / pop out factor
function pop(t, t0, t1, inD = .45, outD = .3) {
  if (t < t0 || t > t1) return 0;
  return E.outBack(seg(t, t0, t0 + inD)) * (1 - E.inBack(seg(t, t1 - outD, t1)));
}
function rr(x, y, w, h, r, ctx = g) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

const INK = '#4A2E22', INK2 = '#8A6A58', CORAL = '#EE6A55', SAGE = '#7DB38C', AMBER = '#FFB061', CREAM = '#FFFBF5';

/* ---------------- fur sprites ---------------- */
function sdfBox(x, y, bx, by, r) { const qx = Math.abs(x) - bx + r, qy = Math.abs(y) - by + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }
function sdfHeart(x, y, a) {
  y += a * .15;
  const u = (x + y) / Math.SQRT2, v = (y - x) / Math.SQRT2;
  const sq = sdfBox(u, v, a, a, a * .22);
  const k = a / Math.SQRT2;
  return Math.min(sq, Math.hypot(x + k, y + k) - a, Math.hypot(x - k, y + k) - a);
}
function furSprite({ w, h, pad = 22, res = 1.4, sdf, round, pal, seed = 1, density = 5, len = [5, 12] }) {
  const cw = Math.ceil((w + pad * 2) * res), ch = Math.ceil((h + pad * 2) * res);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d');
  const ox = cw / 2, oy = ch / 2;
  const grad = (lx, ly) => { const e = .75; let gx = sdf(lx + e, ly) - sdf(lx - e, ly), gy = sdf(lx, ly + e) - sdf(lx, ly - e); const l = Math.hypot(gx, gy) || 1; return [gx / l, gy / l]; };
  const shade = (lx, ly) => {
    const d = sdf(lx, ly), [gx, gy] = grad(lx, ly);
    const depth = clamp(-d / round), nz = Math.sqrt(1 - Math.pow(1 - depth, 2)), k = Math.sqrt(Math.max(0, 1 - nz * nz));
    const lam = clamp(gx * k * -.4 + gy * k * -.55 + nz * .73);
    const s = .32 + .68 * lam, rim = Math.pow(k, 5) * pal.rim;
    return [0, 1, 2].map(i => clamp(lerp(pal.dark[i], pal.light[i], s) + rim * (pal.glow[i] - 128), 0, 255));
  };
  const img = x.createImageData(cw, ch), D = img.data;
  for (let py = 0; py < ch; py++) for (let px = 0; px < cw; px++) {
    const lx = (px - ox) / res, ly = (py - oy) / res, d = sdf(lx, ly);
    if (d < 1) { const col = shade(lx, ly), i = (py * cw + px) * 4; D[i] = col[0]; D[i + 1] = col[1]; D[i + 2] = col[2]; D[i + 3] = 255 * clamp(1 - d); }
  }
  x.putImageData(img, 0, 0);
  const R = rng(seed), N = Math.floor(w * h / density);
  x.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const lx = (R() - .5) * (w + 6), ly = (R() - .5) * (h + 6), d = sdf(lx, ly);
    if (d > 0) continue;
    const [gx, gy] = grad(lx, ly), depth = clamp(-d / round), na = Math.atan2(gy, gx);
    const edgeish = R() < (1 - depth) * 1.25;
    const ang = edgeish ? na + (R() - .5) * 1.1 : (Math.PI / 2 + (R() - .5) * 3.4);
    const L = (len[0] + R() * (len[1] - len[0])) * (edgeish ? 1.15 : .85);
    const col = shade(lx, ly), j = 1 + (R() - .5) * .26;
    x.strokeStyle = rgb(col.map(v => clamp(v * j, 0, 255)), .35 + R() * .4);
    x.lineWidth = (.9 + R() * .9) * res;
    const sx = ox + lx * res, sy = oy + ly * res, ex = sx + Math.cos(ang) * L * res, ey = sy + Math.sin(ang) * L * res;
    const cu = (R() - .5) * L * .6 * res;
    x.beginPath(); x.moveTo(sx, sy);
    x.quadraticCurveTo((sx + ex) / 2 - Math.sin(ang) * cu, (sy + ey) / 2 + Math.cos(ang) * cu, ex, ey); x.stroke();
  }
  return { c, w: cw / res, h: ch / res };
}
function drawSprite(s, cx, cy, sc = 1) { g.drawImage(s.c, cx - s.w * sc / 2, cy - s.h * sc / 2, s.w * sc, s.h * sc); }
function canvasSprite(w, h, res, fn) {
  const c = document.createElement('canvas'); c.width = w * res; c.height = h * res;
  const x = c.getContext('2d'); x.scale(res, res); fn(x); return { c, w, h };
}

const CORAL_PAL = { light: [252, 140, 112], dark: [192, 66, 54], glow: [255, 200, 150], rim: .45 };
const CREAM_PAL = { light: [255, 252, 244], dark: [222, 200, 178], glow: [255, 240, 220], rim: .3 };
let SPR = {};
function buildSprites() {
  SPR.body = furSprite({ w: 440, h: 370, sdf: (x, y) => sdfBox(x, y, 220, 185, 128), round: 120, pal: CORAL_PAL, seed: 7, density: 2.6, len: [3, 8] });
  SPR.arm = furSprite({ w: 100, h: 100, pad: 14, sdf: (x, y) => Math.hypot(x, y) - 50, round: 50, pal: CORAL_PAL, seed: 3, density: 2.4, len: [3, 6] });
  SPR.heart = furSprite({ w: 160, h: 150, pad: 14, sdf: (x, y) => sdfHeart(x, y - 6, 42), round: 40, pal: CREAM_PAL, seed: 11, density: 2.4, len: [3, 6] });
  SPR.mini = furSprite({ w: 120, h: 100, pad: 10, sdf: (x, y) => sdfBox(x, y, 60, 50, 34), round: 34, pal: CORAL_PAL, seed: 5, density: 3.5, len: [3, 6] });

  SPR.wrench = canvasSprite(270, 100, 2, x => {
    const metal = x.createLinearGradient(0, 30, 0, 72); metal.addColorStop(0, '#F7F2EC'); metal.addColorStop(.5, '#D8CEC5'); metal.addColorStop(1, '#AFA39A');
    x.fillStyle = metal; rr(90, 36, 120, 28, 12, x); x.fill();
    x.beginPath(); x.arc(212, 50, 44, 0, TAU); x.fill();
    x.globalCompositeOperation = 'destination-out';
    x.beginPath(); x.arc(226, 50, 17, 0, TAU); x.fill(); x.fillRect(226, 33, 60, 34);
    x.globalCompositeOperation = 'source-over';
    const grip = x.createLinearGradient(0, 30, 0, 72); grip.addColorStop(0, '#FF8E74'); grip.addColorStop(1, '#D9533F');
    x.fillStyle = grip; rr(8, 32, 112, 36, 18, x); x.fill();
    x.fillStyle = 'rgba(255,255,255,.35)'; rr(20, 37, 86, 7, 4, x); x.fill();
    x.fillStyle = 'rgba(255,255,255,.7)'; rr(122, 40, 70, 4, 2, x); x.fill();
    x.fillStyle = '#C24634'; for (let i = 0; i < 4; i++) { rr(34 + i * 18, 58, 8, 5, 2, x); x.fill(); }
  });
  SPR.pills = canvasSprite(230, 96, 2, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(8, 22, 216, 70, 18, x); x.fill();
    x.fillStyle = '#FFFBF4'; rr(4, 14, 216, 70, 18, x); x.fill();
    x.strokeStyle = '#EAD7C4'; x.lineWidth = 2; x.stroke();
    const cols = ['#F4A38C', '#F7C07E', '#F3D77E', '#B6D6A4', '#9DCFCF', '#B7B2E2', '#EBA7C6'], L = 'SMTWTFS';
    x.font = '800 17px Nunito'; x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let i = 0; i < 7; i++) {
      x.fillStyle = cols[i]; rr(14 + i * 29, 22, 25, 54, 8, x); x.fill();
      x.fillStyle = 'rgba(255,255,255,.4)'; rr(17 + i * 29, 25, 19, 8, 4, x); x.fill();
      x.fillStyle = '#fff'; x.fillText(L[i], 26.5 + i * 29, 56);
    }
  });
  SPR.cal = canvasSprite(130, 140, 2, x => {
    x.fillStyle = 'rgba(160,90,60,.18)'; rr(10, 14, 114, 122, 18, x); x.fill();
    x.fillStyle = '#FFFBF4'; rr(6, 8, 114, 122, 18, x); x.fill();
    x.save(); rr(6, 8, 114, 122, 18, x); x.clip(); x.fillStyle = CORAL; x.fillRect(6, 8, 114, 36); x.restore();
    x.fillStyle = '#fff'; x.font = '900 18px Nunito'; x.textAlign = 'center'; x.fillText('THU', 63, 33);
    x.fillStyle = INK; x.font = '600 58px Fredoka'; x.fillText('16', 63, 104);
    x.fillStyle = '#E9D8C7'; [34, 92].forEach(cx => { x.beginPath(); x.arc(cx, 8, 6, 0, TAU); x.fill(); });
  });
  SPR.shield = canvasSprite(140, 160, 2, x => {
    const p = new Path2D('M70 10 C95 24 112 26 128 26 C128 82 112 124 70 150 C28 124 12 82 12 26 C28 26 45 24 70 10Z');
    x.fillStyle = 'rgba(160,90,60,.2)'; x.save(); x.translate(4, 6); x.fill(p); x.restore();
    const gr = x.createLinearGradient(0, 10, 0, 150); gr.addColorStop(0, '#FFFDF8'); gr.addColorStop(1, '#F3E3D1');
    x.fillStyle = gr; x.fill(p); x.strokeStyle = CORAL; x.lineWidth = 9; x.lineJoin = 'round'; x.stroke(p);
    x.strokeStyle = SAGE; x.lineWidth = 13; x.lineCap = 'round';
    x.beginPath(); x.moveTo(44, 78); x.lineTo(63, 98); x.lineTo(98, 58); x.stroke();
  });
}

/* ---------------- character ---------------- */
const HOPS = [
  [0.45, 1.05, 'drop'], [4.6, 5.2, 170], [12.55, 12.95, 70], [15.3, 15.85, 120], [19.6, 20.15, 120],
  [21.55, 21.95, 70], [29.55, 29.95, 70], [37.55, 37.95, 70], [44.6, 45.35, 190],
];
const bxT = track([[0, 960], [4.6, 960], [5.2, 1330], [15.3, 1330], [15.85, 937], [19.6, 937], [20.15, 1330], [44.6, 1330], [45.35, 960]]);
const bsT = track([[0, 1.1], [4.6, 1.1], [5.2, 1], [44.6, 1], [45.35, 1.06]]);
const GROUND = 905;
function hopState(t) {
  let y = 0, sx = 1, sy = 1;
  for (const [a, b, h] of HOPS) {
    if (h === 'drop') {
      if (t < a) y = -1400;
      else if (t <= b) { const p = seg(t, a, b); y = -1100 * (1 - p * p); sy *= 1.12; sx *= .92; }
    } else if (t >= a - .14 && t < a) {
      const p = Math.sin(seg(t, a - .14, a) * Math.PI / 2); sy *= 1 - .12 * p; sx *= 1 + .08 * p;
    } else if (t >= a && t <= b) {
      const p = seg(t, a, b); y = -h * 4 * p * (1 - p); const st = .1 * Math.abs(2 * p - 1); sy *= 1 + st; sx *= 1 - st * .6;
    }
    if (t > b && t < b + .6) {
      const p = seg(t, b, b + .6), sq = (h === 'drop' ? .22 : .15) * Math.exp(-5 * p) * Math.cos(p * Math.PI * 3.2);
      sy *= 1 - sq; sx *= 1 + sq * .8;
    }
  }
  return { y, sx, sy };
}
// props held in the left hand: [t0, t1, name]
const PROPS = [[6.5, 12.6, 'pills'], [14.5, 21.6, 'wrench'], [23.5, 29.6, 'cal'], [31.4, 37.6, 'shield'], [39.5, 99, 'heart']];
const PROP_SPEC = {
  heart: { s: 'heart', ax: -50, ay: 6, rot: -.12, hx: -222, hy: -100 },
  pills: { s: 'pills', ax: 82, ay: 26, rot: .22, hx: -240, hy: -128 },
  wrench: { s: 'wrench', ax: -85, ay: 0, rot: -128 * Math.PI / 180, hx: -205, hy: -126 },
  cal: { s: 'cal', ax: 28, ay: 74, rot: -.12, hx: -240, hy: -128 },
  shield: { s: 'shield', ax: 28, ay: 80, rot: -.1, hx: -240, hy: -128 },
};
const RAYS = [2.4, 6.2, 14.2, 23.2, 31.0, 39.2, 45.9];
const BLINKS = []; for (let t = 1.7; t < DUR; t += 3.1) BLINKS.push(t + (Math.sin(t * 7) * .4));
BLINKS.push(5.4, 20.4, 45.6);
// look direction (negative = toward the left-hand vignette)
const lookKeys = [[0, 0], [2.0, 0], [2.3, .35], [3.0, .35], [3.3, 0]];
[[5, 13], [13, 22], [22, 30], [30, 38], [38, 45]].forEach(([s, e]) => lookKeys.push([s + 1.0, 0], [s + 1.3, -.9], [s + 2.6, -.9], [s + 3.0, -.25], [e - .7, -.25], [e - .3, 0]));
lookKeys.push([46.5, 0], [47.2, .25], [48.4, .25], [49, 0]);
lookKeys.sort((a, b) => a[0] - b[0]);
const lookT = track(lookKeys);

function drawBondi(t) {
  const bx = bxT(t), sc = bsT(t), hs = hopState(t);
  const breath = Math.sin(t * 2.3) * .012;
  // ground shadow
  const air = clamp(-hs.y / 500);
  g.fillStyle = `rgba(150,80,50,${.2 * (1 - air * .8)})`;
  g.beginPath(); g.ellipse(bx, GROUND + 4, 215 * sc * hs.sx * (1 - air * .5), 24 * sc * (1 - air * .5), 0, 0, TAU); g.fill();

  g.save();
  g.translate(bx, GROUND + hs.y);
  g.scale(sc * hs.sx * (1 - breath * .6), sc * hs.sy * (1 + breath));

  // right arm (viewer's right)
  let ra = [214, -190 + Math.sin(t * 2.3 + 1) * 4];
  for (const [a, b] of [[2.6, 4.3], [46.3, 48.8]]) {
    const w = seg(t, a, a + .3) * (1 - seg(t, b - .3, b));
    ra = [lerp(ra[0], 240 + Math.sin(t * 15) * 12, w), lerp(ra[1], -282, w)];
  }
  drawSprite(SPR.body, 0, -185);
  drawSprite(SPR.arm, ra[0], ra[1]);

  // eyes
  const lx = lookT(t);
  let bl = 0; for (const b of BLINKS) if (t > b && t < b + .18) bl = Math.max(bl, Math.sin(seg(t, b, b + .18) * Math.PI));
  const squint = 1 - .28 * seg(t, 31.0, 31.3) * (1 - seg(t, 33.4, 33.8));
  const eyY = Math.max(.08, (1 - bl * .94) * squint);
  for (const ex of [-56, 56]) drawEye(ex + lx * 18, -176, 25, 41 * eyY);

  // prop in left hand
  let hand = [-205, -116 + Math.sin(t * 2.3) * 3];
  let rotAdd = 0, pscale = 1;
  const anyProp = PROPS.find(([a, b]) => t >= a && t <= b);
  if (anyProp) {
    const sp = PROP_SPEC[anyProp[2]], k = clamp(seg(t, anyProp[0], anyProp[0] + .3) * (1 - seg(t, anyProp[1] - .25, anyProp[1])));
    hand = [lerp(hand[0], sp.hx, k), hand[1] + (sp.hy + 116) * k];
  }
  // per-scene hand actions
  const lift = seg(t, 7.9, 8.3) * (1 - seg(t, 9.6, 10)); hand[1] -= lift * 36; rotAdd += lift * .14;
  const fix = seg(t, 15.85, 16.1) * (1 - seg(t, 19.4, 19.6));
  hand = [lerp(hand[0], -205, fix), lerp(hand[1], -154, fix)];
  if (t > 16.0 && t < 18.75) rotAdd += Math.sin((t - 16.0) / .36 * TAU) * .2 * fix;
  const thrust = Math.sin(seg(t, 32.7, 33.4) * Math.PI); hand[0] -= thrust * 30; hand[1] -= thrust * 22; pscale += thrust * .18;
  const beat = Math.max(...[47.6, 48.0, 50.0, 50.4].map(b => Math.sin(seg(t, b, b + .22) * Math.PI))); pscale += beat * .12;
  if (anyProp) {
    const [a, b, name] = anyProp, sp = PROP_SPEC[name];
    const k = pop(t, a, b, .4, .22);
    if (k > 0) {
      g.save(); g.translate(hand[0], hand[1]); g.rotate(sp.rot + rotAdd + Math.sin(t * 2.1) * .03); g.scale(k * pscale, k * pscale);
      const s = SPR[sp.s]; g.drawImage(s.c, -sp.ax - s.w / 2, -sp.ay - s.h / 2, s.w, s.h);
      g.restore();
    }
  }
  drawSprite(SPR.arm, hand[0], hand[1]);

  // notice rays
  for (const r0 of RAYS) {
    const p = seg(t, r0, r0 + 1.1); if (p <= 0 || p >= 1) continue;
    const grow = E.outBack(seg(p, 0, .3)), fade = 1 - seg(p, .7, 1);
    g.save(); g.translate(215, -352); g.strokeStyle = AMBER; g.lineCap = 'round'; g.lineWidth = 13;
    g.shadowColor = 'rgba(255,170,90,.9)'; g.shadowBlur = 22; g.globalAlpha = fade;
    [-80, -42, -6].forEach((deg, i) => {
      const a = deg * Math.PI / 180, d0 = 52 + p * 18, L = (30 + (i === 1 ? 6 : 0)) * grow;
      g.beginPath(); g.moveTo(Math.cos(a) * d0, Math.sin(a) * d0); g.lineTo(Math.cos(a) * (d0 + L), Math.sin(a) * (d0 + L)); g.stroke();
    });
    g.restore();
  }
  g.restore();
  return { bx, top: GROUND + hs.y - 370 * sc };
}
function drawEye(x, y, rx, ry) {
  g.save();
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU);
  g.fillStyle = '#1D1311'; g.fill();
  g.clip();
  g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1.4;
  for (let i = -60; i < 60; i += 4) { g.beginPath(); g.moveTo(x + i, y - 60); g.lineTo(x + i + 30, y + 60); g.stroke(); }
  const hg = g.createRadialGradient(x - rx * .35, y - ry * .45, 0, x - rx * .35, y - ry * .45, rx * 1.1);
  hg.addColorStop(0, 'rgba(255,240,230,.22)'); hg.addColorStop(1, 'rgba(255,240,230,0)');
  g.fillStyle = hg; g.fillRect(x - rx, y - ry, rx * 2, ry * 2);
  g.restore();
  g.strokeStyle = 'rgba(40,20,15,.5)'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.stroke();
}

/* ---------------- background ---------------- */
const BG = [[0, [255, 247, 238], [240, 225, 210]], [6, [255, 244, 224], [245, 220, 190]], [20, [255, 247, 238], [238, 225, 211]],
  [34, [255, 242, 231], [241, 218, 202]], [41, [255, 236, 226], [236, 206, 194]], [47, [255, 246, 236], [243, 222, 205]]];
const PARTS = (() => { const R = rng(42); return Array.from({ length: 34 }, () => ({ x: R() * W, y: R() * H, r: 3 + R() * 10, v: 8 + R() * 22, a: .06 + R() * .14, ph: R() * TAU })); })();
function bgColors(t) {

const cue = (t, notes, step = 0, vel = .6, kind = 'xylo') => (Array.isArray(notes) ? notes : [notes]).forEach((n, i) => CUES.push([t + i * step, n, vel, kind]));

function makeGraph(ac) {

  master.connect(comp); comp.connect(ac.destination);

  verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = .22; verb.connect(wet); wet.connect(master);
  const noise = ac.createBuffer(1, ac.sampleRate * .05, ac.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;

}
function strike(ac, G, t, midi, vel, kind) {

    ? [[1, 1, Math.min(1.3, .75 * Math.sqrt(1046 / f))], [3.0, .26, .22], [6.27, .08, .07]]
    : [[1, 1, 1.5], [4.0, .1, .32], [9.9, .025, .06]];
  const out = ac.createGain(); out.gain.value = vel * (kind === 'xylo' ? .32 : .42);
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  if (pan) { pan.pan.value = clamp((midi - 76) / 30, -.5, .5); out.connect(pan); pan.connect(G.master); pan.connect(G.verb); }
  else { out.connect(G.master); out.connect(G.verb); }

    const o = ac.createOscillator(), e = ac.createGain();

    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(a, t + .003); e.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(e); e.connect(out); o.start(t); o.stop(t + d + .05);
  }

  n.buffer = G.noise; bp.type = 'bandpass'; bp.frequency.value = Math.min(12000, f * 2.6); bp.Q.value = 1.2;
  ne.gain.setValueAtTime(kind === 'xylo' ? .5 : .2, t); ne.gain.exponentialRampToValueAtTime(.001, t + .02);
  n.connect(bp); bp.connect(ne); ne.connect(out); n.start(t); n.stop(t + .04);
}
function schedule(ac, base, from = 0) {
  const G = makeGraph(ac);
  for (const [t, m, v, k] of CUES) if (t >= from) strike(ac, G, base + t - from, m, v, k);
}

if (!RENDER) {
